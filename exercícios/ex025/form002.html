<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p><label for="usu">Usuário:</label>
        <input type="text" name="usuario" id="usu" required maxlength="15" size="10" placeholder="digite seu nome de usuário" autocomplete="username"></p>

        <p><label for="minhasenha">Senha:</label>
        <input type="password" name="senha" id="minhasenha" required minlength="5" placeholder="digite sua senha" size="10" autocomplete="current-password"></p>
        
        <p><input type="submit" value="enviar">
        <input type="reset" value="limpar"></p>
    </form>
</body>
</html>
