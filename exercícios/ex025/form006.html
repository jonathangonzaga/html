<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color, Ranger e File </title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="icor">Cor:</label>
            <input type="color" name="cor" id="icor" value="#ed3247">
        </p>

        <p>
            <label for="ivol">Volume:</label>
            <input type="range" name="vol" id="ivol" min="0" max="10" step="2" value="5">
        </p>

        <p>
            <label for="iserv">Servidor:</label>
            <input type="file" name="serv" id="iserv" multiple capture>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
