<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select, datalist e textarea</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="post">

        <p>
            <label for="iest">Estado</label>
            <select name="est" id="iest">

                <optgroup label="Região Sudeste">
                    <option value="rj">Rio de Janeiro</option>
                    <option value="sp" selected>São Paulo</option>
                    <option value="mg">Minas Gerais</option>
                </optgroup>

                <optgroup label="Região Nordeste">
                    <option value="ma">Maranhão</option>
                    <option value="pe">Pernambuco</option>
                    <option value="rgn">Rio Grande do Norte</option>
                </optgroup>
            </select>

        <p>
            <label for="ifrut">Escolha de Fruta:</label>
            <input list="ilista" name="frut" id="ifrut">
            <datalist id="ilista">
                <option value="Goiaba">Goiaba</option>
                <option value="Maçã">Maçã</option>
                <option value="Morango">Morango</option>
            </datalist>
        </p>

        <p>
            <label for="icoment">Comentários:</label>
            <textarea name="coment" id="icoment" cols="30" rows="10"></textarea>
        </p>

        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
